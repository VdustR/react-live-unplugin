allowBuilds:
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  nx: true
  unrs-resolver: true
catalog:
  "@antfu/eslint-config": ^9.3.0
  "@babel/parser": ^8.0.4
  "@babel/standalone": ^8.0.4
  "@babel/traverse": ^8.0.4
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@commitlint/types": ^21.2.0
  "@docusaurus/core": ^3.10.2
  "@docusaurus/module-type-aliases": ^3.10.2
  "@docusaurus/preset-classic": ^3.10.2
  "@docusaurus/theme-live-codeblock": ^3.10.2
  "@docusaurus/tsconfig": ^3.10.2
  "@docusaurus/types": ^3.10.2
  "@emotion/eslint-plugin": ^11.12.0
  "@eslint/compat": ^2.1.0
  "@eslint-react/eslint-plugin": ^5.18.6
  "@mdx-js/react": ^3.1.1
  "@total-typescript/ts-reset": ^0.6.1
  "@tsconfig/node-ts": ^23.6.4
  "@tsconfig/strictest": ^2.0.8
  "@types/babel__core": ^7.20.5
  "@types/babel__standalone": ^7.1.9
  "@types/babel__traverse": ^7.28.0
  "@types/fs-extra": ^11.0.4
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@typescript/native": npm:typescript@^7.0.2
  "@vitejs/plugin-react-swc": ^4.3.3
  "@vp-tw/eslint-config": ^2.0.0
  "@vp-tw/tsconfig": ^5.0.1
  babel-plugin-react-compiler: ^1.0.0
  clsx: ^2.1.1
  commitizen: ^4.3.2
  cspell: ^10.1.1
  defu: ^6.1.7
  eslint: ^10.9.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-package-json: ^1.7.1
  eslint-plugin-react-compiler: 19.1.0-rc.2
  eslint-plugin-react-refresh: ^0.5.5
  fast-glob: ^3.3.3
  fs-extra: ^11.4.0
  husky: ^9.1.7
  jiti: ^2.7.0
  lerna: ^10.0.1
  lint-staged: ^17.4.1
  pathe: ^2.0.3
  postcss-styled-syntax: ^0.7.2
  prettier: ^3.9.6
  prism-react-renderer: ^2.4.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-live: ^4.1.8
  stylelint: ^17.14.1
  stylelint-config-idiomatic-order: ^10.0.0
  stylelint-config-standard: ^40.0.0
  stylelint-prettier: ^5.0.3
  tsx: ^4.23.12
  typescript: npm:@typescript/typescript6@^6.0.2
  unbuild: ^3.6.1
  unplugin: ^3.3.0
  vite: ^8.2.2
minimumReleaseAgeExclude:
  # Fresh registry latest release verified during this upgrade.
  - lint-staged@17.4.1
overrides:
  # Lerna 10 pins js-yaml 4.3.0. Keep its supported major while applying the
  # patched 4.x release for CVE-2026-59870.
  js-yaml: 4.3.2
  # Lerna 10 pins vulnerable pacote 21.0.1. Keep the supported major while
  # applying the first patched release for GHSA-w4pp-8pjf-rmxw.
  pacote: 21.5.1
  # Docusaurus' webpack-dev-server path accepts qs 6.x. Pin the first patched
  # release for CVE-2026-82562.
  qs: 6.16.0
  # Docusaurus' webpack plugins pin serialize-javascript 6.x. Version 7.0.5 is
  # the first release that fixes both known code-injection and DoS advisories.
  serialize-javascript: 7.0.5
  # SockJS pins uuid 8.x, whose API use is limited to v4(). Use the patched
  # legacy release for CVE-2026-41907.
  uuid: 11.1.1
packages:
  - packages/*
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Mature transitive releases required by current direct dependencies. These
  # predate registry provenance and were reviewed through their ownership paths.
  - "@octokit/endpoint@9.0.6"
  - semver@5.7.2
  - semver@6.3.1
